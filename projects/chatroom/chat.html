<!DOCTYPE html>
<html>
	<head>
		<title>Chatting App</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/x-icon" href="/Images/PfP_R.ico">
	</head>
	<body>
		<div id="container">
			<div id="messages">
				<div id="msg_template">
					<strong><p id="username">Username</p></strong>
					<p id="content">Message</p>
				</div>
			</div>
			<form id="message_box" action="/send-message" method="post">
				<input id="username_input" placeholder="Username" required minlength="4">
				<input id="input" placeholder="Enter your message here!" required minlength="1">
				<button type="submit" id="send">Send</button>
			</form>
		</div>
	</body>
	<script src="new.js"></script>
	<!--script src="script.js"></script-->
</html>
